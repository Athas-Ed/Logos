# 复制为 local.yaml 并填写真实值。local.yaml 已在 .gitignore 中忽略。

# 本地调试 Prompt：GUI 显示「Prompt 回显」开关（需 show_dev_tools_ui: true）
# developer:
#   show_dev_tools_ui: true
#   prompt_echo: false

# 大模型（OpenAI 兼容：DeepSeek / OpenAI 等）
# llm:
#   api_key: "sk-..."
#   base_url: "https://api.deepseek.com/v1"
#   model: "deepseek-chat"
#   verify_ssl: true
#   ca_bundle: "C:/path/to/custom-ca.cer"
#   http_proxy: "http://127.0.0.1:26561"
#   https_proxy: "http://127.0.0.1:26561"
#   no_proxy: "127.0.0.1,localhost"

# 可选：高德天气 MCP（skills/amap-weather-mcp）；需在高德开放平台申请 Web服务 Key
# skills:
#   amap_weather:
#     enabled: true
#     web_api_key: "你的高德Web服务Key"
# 等价环境变量：LOGOS_SKILLS__AMAP_WEATHER__ENABLED=true LOGOS_SKILLS__AMAP_WEATHER__WEB_API_KEY=...

# 可选：覆盖路径类
# paths:
#   workspace_root: "../workspace"

# 可选：日志格式（亦可用 LOGOS_LOGGING__FORMAT=json / LOGOS_LOGGING__FILE_NAME=app.log）
# logging:
#   format: text
#   file_name: logos.log
