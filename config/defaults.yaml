# 可提交仓库的默认配置（勿写真实密钥）。本机覆盖请用 local.yaml。

paths:
  workspace_root: "./workspace"
  # 示例 KSFS（含西游记人物/地点/势力示例数据，已提交至仓库）
  example_ksfs_root: "./example_ksfs"
  # 默认使用示例 KSFS（方便新用户开箱体验）。若有个人创作 KSFS，在 local.yaml 中覆写此路径
  ksfs_root: "./example_ksfs"
  # KSFS→HSI 登记时机（见 KSFS开发.md §3.2 / §3.3）：
  # - false（默认）：首次融合检索 ``query`` 前懒登记（发号、回写 id:）
  # - true：进程启动时在 FastAPI lifespan 内登记一次（仍与懒登记共用去重，重复路径不会双扫）
  sync_hsi_on_startup: false
  # 每次 retrieve / 融合检索前扫描 KSFS，按 mtime/正文哈希增量刷新 HSI（及 SVS，若已装配 Chroma）
  sync_hsi_on_retrieve: true
  # 实体模板契约根；见 resources/entity_template/README.md
  entity_template_root: "./resources/entity_template"
  entity_template_profile: "your_profile_v1"
  # 待落户设定草稿子目录（位于 workspace_root 下）；见 KSFS开发.md §2
  setting_entry_subdir: "setting_entry"
  # 设定撰写（setting_write）专用草稿子目录
  writing_entry_subdir: "writing_entry"
  # 审核晋升（draft_review）专用草稿子目录
  pending_review_subdir: "pending_review"
  index_root: "./.index"
  kg_db_path: "./.index/.kg_cozo.db"
  logs_root: "./logs"
  # 档 B 会话 JSON 根（相对仓库根）；Electron 与 bootstrap 共用，见 DECISIONS.md §13.4
  CONVERSATIONS_CACHE: "./workspace/conversations"
  hsi_sqlite_path: "./.index/.high-speed_index"

embeddings:
  provider: "bge_small_zh"
  model_path: "models/tooling/embeddings/bge-small-zh-v1.5"

chroma:
  persist_directory: "./.index/.vector_index"
  # A5：chunk_id 与分块策略变更后使用新 collection，避免与 v0 单文件块混存
  collection: "ksfs_chunks_v1"

# 稀疏全文索引（FTS5）配置；app.py 组合根按此装配（加载失败自动降级为 HSI+SVS）
retrieval:
  sparse:
    enabled: true
    db_path: "./.index/.sparse_fts.sqlite"

developer:
  show_dev_tools_ui: false
  prompt_echo: false

# MCP stdio 技能（高德、示例 echo 等）：见 docs/子系统文档/Skills与MCP扩展.md
skills:
  mcp_servers: []
  # 技能运行时调优参数的全局默认值
  config:
    # ReAct 步数上限（技能可通过 manifest config_requirements 或 local.yaml overrides 覆写）
    max_steps: 16
    # 连续问答历史保留完整轮数；null 表示不截断
    history_clip_max_full_turns: null
    # 连续追问模式；normal | continuous
    qa_mode: normal

ui:
  default_presentation: "work"
  # 后台 SSE 并发上限（超额排队）；见 DECISIONS.md §13、GUI开发文档.md §12.4
  SSE_maxNum: 3
  # 会话缓存占用告警阈值（字节）；默认 500 MiB
  cache_warn_bytes: 524288000
  # 连续问答：CB 保留最近几轮 user/assistant 全文
  max_history_full_text: 5

agent:
  react:
    max_steps: 16
    # 检索问答（retrieve_qa）每轮 user 问题的 ReAct 步数上限
    max_QA_steps: 20
    # S&G 输出治理：工具观测写入上下文（append_observation）前的最大字符数；0 表示不截断
    max_tool_observation_chars: 100000

obs:
  log_profile: "standard"
  # Obs O4：为 true 时 bootstrap 暴露 obs_logs_root，GUI 设置页可展示「日志根」绝对路径（默认 false）
  show_log_root_in_gui: false

# OpenAI 兼容对话（DeepSeek 等）；密钥仅放 local.yaml 或环境变量 LOGOS_LLM__API_KEY
llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  verify_ssl: true
  ca_bundle: null
  http_proxy: null
  https_proxy: null
  no_proxy: "127.0.0.1,localhost"
