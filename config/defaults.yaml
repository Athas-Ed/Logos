# 可提交仓库的默认配置（勿写真实密钥）。本机覆盖请用 local.yaml。

# operating_mode: author

paths:
  workspace_root: "./workspace"
  example_ksfs_root: "./example_ksfs"
  # LKC 镜像根（KSFS→LKC 同步产物；read_lkc 仅读此目录下）
  lkc_root: "./workspace/lkc"
  # 所有索引类文件默认根目录（不入库）
  index_root: "./.index"
  # 应用日志根目录（Obs）；不存在时会自动创建。可用 local.yaml 或 LOGOS_PATHS__LOGS_ROOT 覆盖。
  logs_root: "./logs"

  # HSI：SQLite 单文件，默认文件名 .high-speed_index
  hsi_sqlite_path: "./.index/.high-speed_index"

embeddings:
  provider: "bge_small_zh"
  model_path: "models/tooling/embeddings/bge-small-zh-v1.5"

chroma:
  # SVS：Chroma 持久化目录
  persist_directory: "./.index/.vector_index"
  collection: "lkc_chunks_v0"

ui:
  default_presentation: "work"

obs:
  log_profile: "standard"

# OpenAI 兼容对话（DeepSeek 等）；密钥仅放 local.yaml 或环境变量 LOGOS_LLM__API_KEY
llm:
  base_url: "https://api.deepseek.com/v1"
  model: "deepseek-chat"
  # HTTPS 校验：false / 0 关闭校验（不推荐）；ca_bundle 为 PEM/CER 信任包路径
  verify_ssl: true
  ca_bundle: null
  # 仅作用于 LLM 的 httpx 客户端；留空则仍可读系统环境变量 HTTP_PROXY 等（trust_env）
  http_proxy: null
  https_proxy: null
  no_proxy: "127.0.0.1,localhost"
