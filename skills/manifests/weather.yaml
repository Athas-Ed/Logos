skill_id: weather
display_name: 天气查询
description: 查询中国境内城市的实况天气。
ui_instructions: |
  输入一个地点，助手将调用天气接口查询并提供该地点的实况天气信息（单轮）。
  示例：北京的天气怎么样？
persistence_tier: p2
paradigm: react
turn_policy: single
allowed_tools:
  - query_weather
prompt_runtime_key: skills/weather
input_schema:
  type: object
  properties:
    location:
      type: string
      title: 地点
  required:
    - location