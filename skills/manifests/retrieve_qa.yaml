skill_id: retrieve_qa
display_name: 检索问答
description: 先 retrieve 定位文档，再用 read_ksfs 读取 KSFS 原文后作答（ReAct）。
ui_instructions: |
  用自然语言提问；助手会先检索 KSFS，再按需 read_ksfs 读原文，最后作答。
  执行阶段可在页面查看 ReAct 工具轨迹与检索引用。
  示例：有罪者的大道怎么去藏骨堂？需要哪些步骤？
persistence_tier: p2
paradigm: react
turn_policy: single
allowed_tools:
  - retrieve
  - read_ksfs
prompt_runtime_key: skills/retrieve_qa
input_schema:
  type: object
  properties:
    text:
      type: string
      title: 问题
  required:
    - text
