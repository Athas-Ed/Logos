[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logos"
version = "0.1.0"
description = "Logos: dual-mode narrative agent for game writers (V0.1 scaffold)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chromadb>=0.5",
    "sentence-transformers>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: 需要本机 BGE 权重或较慢的集成测（可用 pytest -m \"not slow\" 跳过）",
]
